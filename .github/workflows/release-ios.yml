name: Release IPA & Build Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      export_method:
        description: 'Export method'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - ad-hoc
          - app-store
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release-ipa:
    name: Build, Package & Release IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Verify Signing Secrets Available
        id: check_secrets
        run: |
          if [[ -z "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" || -z "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" ]]; then
            echo "⚠️ Official signing credentials not configured in GitHub Secrets."
            echo "A sideloadable / unsigned IPA package will be produced."
            echo "has_signing=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Apple signing credentials detected."
            echo "has_signing=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Apple Certificate and Provisioning Profile
        if: steps.check_secrets.outputs.has_signing == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary-ci-keychain-pass' }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Set Build Numbers
        run: |
          VERSION="${{ github.event.inputs.version || '1.0.0' }}"
          BUILD_NUMBER="${{ github.run_number }}"
          echo "Building Marketing Version: $VERSION, Build Number: $BUILD_NUMBER"

      - name: Archive Project
        run: |
          chmod +x scripts/*.sh
          ./scripts/archive.sh

      - name: Export & Package IPA
        env:
          HAS_SIGNING: ${{ steps.check_secrets.outputs.has_signing }}
          IPA_FILENAME: "SharkPowerV2-${{ github.event.inputs.version || github.ref_name }}.ipa"
        run: |
          ./scripts/export-ipa.sh

      - name: Compress xcarchive Bundle
        run: |
          cd build
          zip -qr SharkPowerV2.xcarchive.zip SharkPowerV2.xcarchive

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SharkPowerV2-${{ github.event.inputs.version || github.ref_name }}-build-${{ github.run_number }}.ipa
          path: build/ipa/*.ipa
          retention-days: 14

      - name: Upload xcarchive Bundle
        uses: actions/upload-artifact@v4
        with:
          name: SharkPowerV2-xcarchive-${{ github.event.inputs.version || github.ref_name }}
          path: build/SharkPowerV2.xcarchive.zip
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.event.inputs.version || '1.0.0') }}
          files: |
            build/ipa/*.ipa
            build/SharkPowerV2.xcarchive.zip
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Clean Temporary Keychain
        if: always() && steps.check_secrets.outputs.has_signing == 'true'
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f $RUNNER_TEMP/build_certificate.p12 $RUNNER_TEMP/build_pp.mobileprovision
