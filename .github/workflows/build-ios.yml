name: Build & Test iOS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build (macOS)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Run Integrity Pre-Flight Check
        run: |
          chmod +x scripts/*.sh
          ./scripts/ci-check.sh

      - name: Run Unit Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project SharkPowerV2.xcodeproj \
            -scheme SharkPowerV2 \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild_test.log || {
              echo "=========================================================="
              echo "=== XCODEBUILD TEST FAILED — CRITICAL ERROR SUMMARY ==="
              echo "=========================================================="
              grep -E "(error:|fatal error:|FAILED|\*\* TEST FAILED \*\*|Test Case .* failed)" xcodebuild_test.log | tail -n 50
              exit 1
            }

      - name: Build Release Archive
        run: |
          ./scripts/archive.sh

      - name: Package IPA
        run: |
          ./scripts/export-ipa.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SharkPowerV2-ipa-${{ github.sha }}
          path: build/ipa/*.ipa
          retention-days: 7

      - name: Upload xcarchive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SharkPowerV2-archive-${{ github.sha }}
          path: build/SharkPowerV2.xcarchive
          retention-days: 7
