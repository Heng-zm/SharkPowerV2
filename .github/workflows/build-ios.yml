name: Build iPhone IPA

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 1.0.5)'
        required: false
        default: '1.0.5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iPhone IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Run Integrity Pre-Flight Check
        run: |
          chmod +x scripts/*.sh
          ./scripts/ci-check.sh

      - name: Run Unit Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project SharkPowerV2.xcodeproj \
            -scheme SharkPowerV2 \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild_test.log || {
              echo "=========================================================="
              echo "=== XCODEBUILD TEST FAILED — CRITICAL ERROR SUMMARY ==="
              echo "=========================================================="
              grep -E "(error:|fatal error:|FAILED|\*\* TEST FAILED \*\*|Test Case .* failed)" xcodebuild_test.log | tail -n 50
              exit 1
            }

      - name: Check Apple Signing Credentials
        id: check_signing
        run: |
          if [[ -n "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" && -n "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" ]]; then
            echo "has_signing=true" >> $GITHUB_OUTPUT
            echo "✅ Apple signing credentials found in secrets."
          else
            echo "has_signing=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No Apple signing credentials in secrets. Direct payload IPA will be built."
          fi

      - name: Install Apple Certificate & Profile (Optional)
        if: steps.check_signing.outputs.has_signing == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'ci-temporary-keychain-pass' }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build Archive
        run: |
          ./scripts/archive.sh

      - name: Package iPhone IPA
        env:
          HAS_SIGNING: ${{ steps.check_signing.outputs.has_signing }}
          IPA_FILENAME: "SharkPowerV2-${{ github.ref_type == 'tag' && github.ref_name || (github.event.inputs.version || 'latest') }}.ipa"
        run: |
          ./scripts/export-ipa.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SharkPowerV2-${{ github.ref_type == 'tag' && github.ref_name || (github.event.inputs.version || github.sha) }}.ipa
          path: build/ipa/*.ipa
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.event.inputs.version || '1.0.5') }}
          files: build/ipa/*.ipa
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Clean Keychain
        if: always() && steps.check_signing.outputs.has_signing == 'true'
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f $RUNNER_TEMP/build_certificate.p12 $RUNNER_TEMP/build_pp.mobileprovision
